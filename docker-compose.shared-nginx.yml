# Opt-in overlay for a host that already runs its own nginx fronting other
# sites, and/or runs the Freemiga shop alongside this service. NOT
# auto-loaded by plain `docker compose` — pass it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.shared-nginx.yml up -d
#
# Three attachments to the pre-existing `web_shared` external network:
#   - grafana: stable alias so external nginx's proxy_pass can reach it by
#     name instead of an IP that changes on every recreate.
#   - api: stable alias so the Freemiga shop's own container (also on
#     web_shared, see that repo's same-named overlay) can reach
#     PUT /api/v1/admin/users/{username}/device-limit directly over the
#     internal network instead of the host-published port.
#   - worker: no alias needed (it only ever calls out to Freemiga's
#     `freemiga_app` alias, via shop_integration.base_url in config.yaml)
#     — just needs network membership to resolve that name.
#
# web_shared itself must already exist and the external nginx container
# must already be connected to it (see the Freemiga repo's README).
services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-}"
    networks:
      default:
      web_shared:
        aliases:
          - marzban_guard_grafana

  api:
    networks:
      default:
      web_shared:
        aliases:
          - marzban_guard_api

  worker:
    networks:
      default:
      web_shared:

networks:
  web_shared:
    external: true
