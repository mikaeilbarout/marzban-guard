[project]
name = "marzban-guard"
version = "0.1.0"
description = "Abuse detection & mitigation system for Marzban/Xray VPN nodes"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "collector"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's idiomatic `= Depends(...)` in argument defaults IS the
# pattern, not a bug — every FastAPI route in this codebase does it.
ignore = ["B008"]
